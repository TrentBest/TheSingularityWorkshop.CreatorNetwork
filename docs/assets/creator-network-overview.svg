<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">CreatorNetwork: one portable publication, many providers and clients</title>
  <desc id="desc">Creator identity and a versioned publication connect to replaceable content hosts and independent discovery providers. Many independent clients consume the same publication.</desc>
  <defs><style>.bg{fill:#101827}.panel{fill:#18263a;stroke:#77d5e8;stroke-width:2}.provider{fill:#20243a;stroke:#b7a1ff;stroke-width:2}.client{fill:#1e3440;stroke:#88d9a8;stroke-width:2}.txt{font:600 22px system-ui,sans-serif;fill:#f3f6ff}.sub{font:16px system-ui,sans-serif;fill:#c8d5e8}.line{stroke:#a8c8df;stroke-width:3;fill:none}.accent{fill:#f4cf72}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#a8c8df"/></marker></defs>
  <rect class="bg" width="1200" height="650" rx="28"/><text class="txt" x="600" y="48" text-anchor="middle" font-size="28">CreatorNetwork · portable by design</text>
  <rect class="panel" x="35" y="100" width="260" height="135" rx="18"/><text class="txt" x="165" y="145" text-anchor="middle">Creator / tools</text><text class="sub" x="165" y="177" text-anchor="middle">Author and publish</text><text class="sub" x="165" y="201" text-anchor="middle">without one required host</text>
  <rect class="panel" x="365" y="85" width="470" height="165" rx="22"/><text class="txt" x="600" y="128" text-anchor="middle">Portable publication</text><text class="sub" x="600" y="162" text-anchor="middle">Creator identity · channel · versioned metadata</text><text class="sub" x="600" y="188" text-anchor="middle">Rights / visibility declarations · content references</text><text class="sub" x="600" y="216" text-anchor="middle">Exportable contract, not a platform account</text><path class="line" marker-end="url(#arrow)" d="M295 165 H355"/>
  <rect class="provider" x="70" y="330" width="300" height="125" rx="18"/><text class="txt" x="220" y="374" text-anchor="middle">Replaceable content hosts</text><text class="sub" x="220" y="405" text-anchor="middle">Origin · replica · cache</text><text class="sub" x="220" y="429" text-anchor="middle">Media bytes and delivery</text>
  <rect class="provider" x="450" y="330" width="300" height="125" rx="18"/><text class="txt" x="600" y="374" text-anchor="middle">Independent discovery</text><text class="sub" x="600" y="405" text-anchor="middle">Search · feeds · communities</text><text class="sub" x="600" y="429" text-anchor="middle">Replaceable ranking policies</text>
  <rect class="provider" x="830" y="330" width="300" height="125" rx="18"/><text class="txt" x="980" y="374" text-anchor="middle">Export / migration</text><text class="sub" x="980" y="405" text-anchor="middle">Manifest + media inventory</text><text class="sub" x="980" y="429" text-anchor="middle">Move without identity reset</text>
  <path class="line" marker-end="url(#arrow)" d="M485 250 L260 320"/><path class="line" marker-end="url(#arrow)" d="M600 250 V320"/><path class="line" marker-end="url(#arrow)" d="M715 250 L940 320"/>
  <rect class="client" x="70" y="515" width="1060" height="92" rx="18"/><text class="txt" x="600" y="550" text-anchor="middle">Independent clients and experiences</text><text class="sub" x="600" y="580" text-anchor="middle">Web · desktop · education · virtual worlds · games · independent players</text><path class="line" marker-end="url(#arrow)" d="M220 455 V500"/><path class="line" marker-end="url(#arrow)" d="M600 455 V500"/><path class="line" marker-end="url(#arrow)" d="M980 455 V500"/><text class="accent" x="600" y="633" text-anchor="middle" font-size="14">Creator-owned identity · replaceable providers · viewer choice</text>
</svg>
